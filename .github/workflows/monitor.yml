name: Internship monitor

on:
  workflow_dispatch:
  # schedule:
  #   - cron: '*/15 6-18 * * *'   # every 15 min, 06:00-18:45 UTC

permissions:
  contents: write

concurrency: monitor

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Telegram config from secrets
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          mkdir -p config
          echo "{\"bot_token\": \"$BOT_TOKEN\", \"chat_id\": \"$CHAT_ID\"}" > config/telegram.json
      - run: python scripts/check_all_offers.py
      - name: Commit state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f config/*_known*.json config/quintet_state.txt 2>/dev/null || true
          git diff --staged --quiet || { git commit -m "chore: update state [skip ci]"; git pull --rebase; git push; }
